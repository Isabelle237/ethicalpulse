{% load static %}
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Ethical Pulse Shield{% endblock %}</title>
    <link
      href="{% static 'vendor/bootstrap/bootstrap.min.css' %}"
      rel="stylesheet"
    />
    <link
      href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}"
      rel="stylesheet"
    />
    <link href="{% static 'css/style.css' %}" rel="stylesheet" />
    <style>
      body {
        background-color: #f5f5f5;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><rect width="100" height="100" fill="%23f5f5f5"/><path d="M0 50 Q 25 25, 50 50 T 100 50 L 100 100 L 0 100 Z" fill="%23e9ecef"/></svg>');
        background-size: cover;
        background-position: center;
        min-height: 100vh;
        display: flex;
        align-items: center;
      }
    </style>
  </head>
  <body>
    {% block content %}{% endblock %}
    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
  </body>
</html>
