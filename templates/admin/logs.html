{% extends 'admin/admin_base.html' %}

{% block content %}
<div class="card mt-4">
    <div class="card-header bg-dark text-white">
        <i class="bi bi-terminal me-2"></i> Logs de l'application
    </div>
    <div class="card-body" style="background-color: #1e1e1e; color: #ccc; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap;">
        {% if logs %}
            {% for line in logs %}
                {{ line }}
            {% endfor %}
        {% else %}
            <p>Aucun log disponible.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
